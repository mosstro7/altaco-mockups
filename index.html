<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlTaco Carpintería · Mockup Home</title>
<meta name="description" content="Mockup de la página de inicio de AlTaco Carpintería — muebles a medida.">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap">
<style>
  :root{
    --bg:#CDAD84; --ink:#241809; --brown:#4A2E17; --wood:#8A5A2B; --muted:#6E5636;
    --line:rgba(53,39,27,.12); --glass:rgba(255,255,255,.62);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:var(--brown);text-decoration:none}
  a:hover{color:var(--wood)}
  .page{max-width:1440px;margin:0 auto;background:var(--bg);overflow:hidden}

  /* Header */
  .site-header{background:url("img/header.jpg") center/cover no-repeat;padding:44px 56px 40px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
  .brand{display:flex;flex-direction:column;align-items:center;gap:9px;padding:22px 44px 20px;border-radius:14px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 40px 18px rgba(255,255,255,.28)}
  .brand-logo{width:86px;height:86px;overflow:hidden;position:relative;margin-bottom:6px}
  .brand-logo img{position:absolute;top:-12px;left:-24px;width:132px;height:auto;max-width:none}
  .brand-name{font-family:'Playfair Display',Georgia,serif;font-size:46px;font-weight:500;letter-spacing:.01em;line-height:1;color:var(--ink)}
  .brand-rule{width:132px;height:1px;background:var(--wood);opacity:.55}
  .brand-sub{font-size:10.5px;letter-spacing:.44em;color:var(--muted);text-transform:uppercase}
  .header-social{display:flex;justify-content:flex-end}
  .icon-btn{display:flex;width:40px;height:40px;align-items:center;justify-content:center;border:1px solid rgba(53,39,27,.14);border-radius:9px;color:var(--brown);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .2s,color .2s}
  .icon-btn:hover{border-color:var(--wood);color:var(--wood)}

  /* Nav */
  .site-nav{background:#fff;border-top:1px solid rgba(53,39,27,.09);display:flex;justify-content:center;flex-wrap:wrap;gap:12px 56px;padding:19px 16px 18px}
  .site-nav a{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);padding-bottom:5px;border-bottom:1.5px solid transparent;transition:color .2s}
  .site-nav a:hover{color:var(--brown)}
  .site-nav a.active{color:var(--ink);border-bottom-color:var(--brown)}

  /* Carousel */
  .carousel{position:relative;width:100%;height:480px;overflow:hidden;background:#c19f74}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .6s ease;pointer-events:none}
  .slide.active{opacity:1;pointer-events:auto}
  .slide img{display:block;width:100%;height:100%;object-fit:cover;min-width:0}
  .slide-grid{display:grid;gap:6px;height:100%;background:var(--ink)}
  .cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cols-5{grid-template-columns:repeat(5,minmax(0,1fr))}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:none;border-radius:50%;background:rgba(255,255,255,.78);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(2px);transition:background .2s;z-index:2}
  .arrow:hover{background:#fff}
  .arrow.prev{left:26px}.arrow.next{right:26px}
  .dots{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:10px;z-index:2}
  .dot{width:8px;height:8px;padding:0;border:1px solid rgba(255,255,255,.9);border-radius:50%;cursor:pointer;background:transparent}
  .dot.active{background:#fff}

  /* Sections */
  .sections{padding:92px 56px 96px}
  .sections-head{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:46px}
  .sections-head h2{margin:0;font-family:'Playfair Display',Georgia,serif;font-size:29px;font-weight:400;color:var(--ink)}
  .sections-head span{width:44px;height:1px;background:var(--wood)}
  .cards{display:grid;grid-template-columns:repeat(5,1fr);gap:22px}
  .card{position:relative;display:block;height:300px;border-radius:18px;overflow:hidden;background:#E2CBA8}
  .card img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
  .card:hover img{transform:scale(1.04)}
  .card-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(53,39,27,.34) 0%,rgba(53,39,27,.30) 45%,rgba(53,39,27,.62) 100%);display:flex;align-items:center;justify-content:center;pointer-events:none}
  .card-label{position:absolute;left:0;right:0;bottom:22px;text-align:center;pointer-events:none;font-size:11px;letter-spacing:.22em;color:#fff;text-transform:uppercase;font-weight:500}

  /* Footer */
  .site-footer{border-top:1px solid var(--line);padding:52px 56px 58px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
  .footer-name{font-family:'Playfair Display',Georgia,serif;font-size:19px}
  .footer-contact{display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:12px 26px;font-size:12px;color:var(--brown)}
  .sep{width:1px;height:11px;background:rgba(53,39,27,.22)}
  .footer-contact a{display:inline-flex;align-items:center;gap:7px}
  .footer-place{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

  /* Responsive (no está en el mockup original de 1440px; agregado para verlo en el celular) */
  @media (max-width:1100px){ .cards{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:720px){
    .site-header{padding:28px 16px;grid-template-columns:1fr}
    .site-header>div:first-child{display:none}
    .header-social{justify-content:center;margin-top:16px}
    .brand{padding:18px 30px 16px}
    .brand-name{font-size:38px}
    .site-nav{gap:10px 24px}
    .carousel{height:360px}
    .cols-5{grid-template-columns:repeat(3,minmax(0,1fr))}
    .cols-5 img:nth-child(n+4){display:none}
    .arrow.prev{left:12px}.arrow.next{right:12px}
    .sections{padding:56px 16px 64px}
    .cards{grid-template-columns:repeat(2,1fr);gap:14px}
    .card{height:220px}
    .site-footer{padding:40px 16px 44px}
    .sep{display:none}
  }
  @media (prefers-reduced-motion:reduce){ .slide,.card img{transition:none} }
</style>
</head>
<body>
<div class="page">

  <header class="site-header">
    <div></div>
    <div class="brand">
      <div class="brand-logo"><img src="img/logo.png" alt="Logo AlTaco"></div>
      <div class="brand-name">AlTaco</div>
      <div class="brand-rule"></div>
      <div class="brand-sub">Carpintería</div>
    </div>
    <div class="header-social">
      <a href="#" class="icon-btn" aria-label="Instagram">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
      </a>
    </div>
  </header>

  <nav class="site-nav">
    <a href="#" class="active">Inicio</a>
    <a href="#">Catálogo</a>
    <a href="#">Presupuesto</a>
    <a href="#">Cursos</a>
    <a href="#">Acerca de</a>
  </nav>

  <section class="carousel" aria-roledescription="carrusel" aria-label="Trabajos de AlTaco">
    <div class="slide active">
      <img src="img/slide1.jpg" alt="Mueble de TV a medida">
    </div>
    <div class="slide">
      <div class="slide-grid cols-3">
        <img src="img/slide2a.jpg" alt="Trabajo de carpintería" loading="lazy">
        <img src="img/slide2b.jpg" alt="Trabajo de carpintería" loading="lazy">
        <img src="img/slide2c.jpg" alt="Trabajo de carpintería" loading="lazy">
      </div>
    </div>
    <div class="slide">
      <div class="slide-grid cols-3">
        <img src="img/slide3a.jpg" alt="Trabajo de carpintería" loading="lazy">
        <img src="img/slide3b.jpg" alt="Trabajo de carpintería" loading="lazy">
        <img src="img/slide3c.jpg" alt="Trabajo de carpintería" loading="lazy">
      </div>
    </div>
    <div class="slide">
      <div class="slide-grid cols-5">
        <img src="img/slide4a.jpg" alt="Trabajo de carpintería" loading="lazy">
        <img src="img/slide4b.jpg" alt="Trabajo de carpintería" loading="lazy">
        <img src="img/slide4c.jpg" alt="Trabajo de carpintería" loading="lazy">
        <img src="img/slide4d.jpg" alt="Trabajo de carpintería" loading="lazy">
        <img src="img/slide4e.jpg" alt="Trabajo de carpintería" loading="lazy">
      </div>
    </div>

    <button class="arrow prev" aria-label="Anterior">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="arrow next" aria-label="Siguiente">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <div class="dots">
      <button class="dot active" aria-label="Slide 1"></button>
      <button class="dot" aria-label="Slide 2"></button>
      <button class="dot" aria-label="Slide 3"></button>
      <button class="dot" aria-label="Slide 4"></button>
    </div>
  </section>

  <section class="sections">
    <div class="sections-head">
      <h2>Nuestras secciones</h2>
      <span></span>
    </div>
    <div class="cards">
      <a href="#" class="card">
        <img src="img/card-dormitorio.jpg" alt="" loading="lazy">
        <div class="card-overlay"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18v-6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v6"/><path d="M2 18h20"/><path d="M4 10V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3"/><path d="M8 10V6.5"/><path d="M16 10V6.5"/></svg></div>
        <div class="card-label">Dormitorio</div>
      </a>
      <a href="#" class="card">
        <img src="img/card-living.jpg" alt="" loading="lazy">
        <div class="card-overlay"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="10" rx="1.5"/><path d="M8 19h8"/><path d="M12 15v4"/></svg></div>
        <div class="card-label">Living</div>
      </a>
      <a href="#" class="card">
        <img src="img/card-cocina.jpg" alt="" loading="lazy">
        <div class="card-overlay"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="7" rx="1.2"/><rect x="3" y="14" width="18" height="7" rx="1.2"/><path d="M12 3v7"/><path d="M12 14v7"/><path d="M9 6.2h1.2"/><path d="M13.8 6.2H15"/></svg></div>
        <div class="card-label">Cocina</div>
      </a>
      <a href="#" class="card">
        <img src="img/card-mesadas.jpg" alt="" loading="lazy">
        <div class="card-overlay"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9h19"/><path d="M4 9v11"/><path d="M20 9v11"/><path d="M2.5 9 5 4.5h14L21.5 9"/><rect x="13" y="12" width="7" height="8" rx="1"/><path d="M13 16h7"/></svg></div>
        <div class="card-label">Mesadas</div>
      </a>
      <a href="#" class="card">
        <img src="img/card-bano.webp" alt="" loading="lazy">
        <div class="card-overlay"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15h18"/><path d="M5 15v5"/><path d="M19 15v5"/><path d="M6 11h12"/><path d="M6 11 8 7h8l2 4"/><path d="M8.5 15v-4"/><path d="M15.5 15v-4"/></svg></div>
        <div class="card-label">Baño</div>
      </a>
    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-name">AlTaco</div>
    <div class="footer-contact">
      <span>+54 9 351 000 0000</span>
      <span class="sep"></span>
      <span>hola@altaco.com.ar</span>
      <span class="sep"></span>
      <a href="#">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
        @altaco.carpinteria
      </a>
    </div>
    <div class="footer-place">Córdoba, Argentina · Muebles a medida</div>
  </footer>

</div>

<script>
(function(){
  var slides = document.querySelectorAll('.slide');
  var dots = document.querySelectorAll('.dot');
  var n = slides.length, i = 0, timer = null;
  function show(k){
    i = (k + n) % n;
    slides.forEach(function(s,j){ s.classList.toggle('active', j === i); });
    dots.forEach(function(d,j){ d.classList.toggle('active', j === i); });
  }
  function stop(){ if (timer) { clearInterval(timer); timer = null; } }
  function go(k){ stop(); show(k); }
  document.querySelector('.arrow.prev').addEventListener('click', function(){ go(i - 1); });
  document.querySelector('.arrow.next').addEventListener('click', function(){ go(i + 1); });
  dots.forEach(function(d,j){ d.addEventListener('click', function(){ go(j); }); });
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    timer = setInterval(function(){ show(i + 1); }, 5200);
  }
})();
</script>
</body>
</html>
